<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1366" viewBox="0 0 1024 1366">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a365d" />
      <stop offset="100%" stop-color="#2c5282" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1366" fill="url(#gradient)" />
  
  <!-- Decorative elements resembling dental elements -->
  <g opacity="0.05" fill="#FFFFFF">
    <circle cx="200" cy="250" r="70" />
    <circle cx="520" cy="180" r="90" />
    <circle cx="780" cy="400" r="80" />
    <circle cx="320" cy="550" r="65" />
    <circle cx="620" cy="700" r="75" />
    <circle cx="180" cy="850" r="55" />
    <circle cx="450" cy="950" r="85" />
    <circle cx="750" cy="1100" r="60" />
    <circle cx="300" cy="1200" r="75" />
    <circle cx="600" cy="1300" r="50" />
  </g>
  
  <!-- Lines resembling dental tools -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="3">
    <line x1="150" y1="150" x2="300" y2="250" />
    <line x1="500" y1="200" x2="700" y2="350" />
    <line x1="800" y1="400" x2="650" y2="550" />
    <line x1="400" y1="600" x2="200" y2="750" />
    <line x1="600" y1="800" x2="800" y2="950" />
    <line x1="300" y1="1000" x2="450" y2="1150" />
    <line x1="700" y1="1200" x2="500" y2="1350" />
  </g>
</svg> 